services:
  mysql-master:
    image: mysql:8.0
    container_name: mysql-master
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: supermarket
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass
    ports:
      - "3307:3306"
    command:
      - --default-authentication-plugin=mysql_native_password
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-do-db=supermarket
      - --transaction-isolation=READ-COMMITTED
    volumes:
      - mysql-master-data:/var/lib/mysql
      - ./config/master.cnf:/etc/mysql/conf.d/master.cnf:ro
      - ./scripts/01-init-master.sql:/docker-entrypoint-initdb.d/01-init-master.sql:ro
      - ../database/01_schema.sql:/docker-entrypoint-initdb.d/02_schema.sql:ro
      - ../database/02_seed_data.sql:/docker-entrypoint-initdb.d/03_seed_data.sql:ro
    networks:
      - db-cluster

  mysql-slave-1:
    image: mysql:8.0
    container_name: mysql-slave-1
    restart: unless-stopped
    depends_on:
      - mysql-master
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: supermarket
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass
    ports:
      - "3308:3306"
    command:
      - --default-authentication-plugin=mysql_native_password
      - --server-id=2
      - --skip-log-bin
      - --relay-log=relay-bin
      - --read-only=1
      - --binlog-format=ROW
    volumes:
      - mysql-slave-1-data:/var/lib/mysql
      - ./config/slave1.cnf:/etc/mysql/conf.d/slave1.cnf:ro
    networks:
      - db-cluster

  mysql-slave-2:
    image: mysql:8.0
    container_name: mysql-slave-2
    restart: unless-stopped
    depends_on:
      - mysql-master
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: supermarket
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass
    ports:
      - "3309:3306"
    command:
      - --default-authentication-plugin=mysql_native_password
      - --server-id=3
      - --skip-log-bin
      - --relay-log=relay-bin
      - --read-only=1
      - --binlog-format=ROW
    volumes:
      - mysql-slave-2-data:/var/lib/mysql
      - ./config/slave2.cnf:/etc/mysql/conf.d/slave2.cnf:ro
    networks:
      - db-cluster

  proxysql:
    image: proxysql/proxysql:3
    container_name: proxysql
    restart: unless-stopped
    depends_on:
      - mysql-master
      - mysql-slave-1
      - mysql-slave-2
    ports:
      - "6032:6032"
      - "6033:6033"
    volumes:
      - proxysql-data:/var/lib/proxysql
      - ./config/proxysql.cnf:/etc/proxysql.cnf:ro
    networks:
      - db-cluster

volumes:
  mysql-master-data:
  mysql-slave-1-data:
  mysql-slave-2-data:
  proxysql-data:

networks:
  db-cluster:
    driver: bridge
